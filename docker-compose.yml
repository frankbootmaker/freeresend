services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freeresend
      POSTGRES_USER: freeresend
      POSTGRES_PASSWORD: freeresend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeresend"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://freeresend:freeresend@postgres:5432/freeresend
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["dev"]
    ports:
      - "1026:1025"
      - "8026:8025"

  smtp:
    profiles: ["smtp"]
    build:
      context: .
      target: smtp
    ports:
      - "2525:2525"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://freeresend:freeresend@postgres:5432/freeresend
      DATABASE_SSL: "false"
      SMTP_LISTEN_HOST: 0.0.0.0
      SMTP_LISTEN_PORT: "2525"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
