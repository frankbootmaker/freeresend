apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relayhorizon
  namespace: relayhorizon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relayhorizon
  minReplicas: 2
  maxReplicas: 10
  # NOTE: do NOT add a `memory` Resource metric here.
  # HPA memory utilisation is a PER-POD AVERAGE and the HPA takes the MAX across metrics.
  # V8 grows its heap toward the limit and never returns it, so adding replicas does NOT
  # lower per-pod memory - the metric cannot fall below target and welds the replica count up.
  # Worse, each scale-up averages in a FRESH low heap and temporarily hides the problem:
  # familygpt-app measured 683Mi (9-day pod) + 126Mi (new pod) = 53% average against a 768Mi
  # request, looking calm while already unable to scale back down. A utilisation reading
  # BELOW target is therefore NOT evidence that a memory-target HPA is safe.
  # Removed 2026-08-25 as part of ELI-260 / ELI-289.
  # If you need a non-CPU signal, use a real load metric (queue depth, connections), not memory.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30